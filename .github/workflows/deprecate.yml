name: Deprecate

on:
  workflow_dispatch:
    inputs:
      range:
        description: 'semver range to deprecate (e.g. "*", "<2", "1.6.0")'
        required: true
        default: '*'
      message:
        description: 'Deprecation message shown on install ("" un-deprecates)'
        required: true
        default: 'No longer maintained. Use @europace/thrty-* instead: https://github.com/europace/thrty'

jobs:
  deprecate:
    runs-on: 'ubuntu-latest'
    steps:
      - name: Node setup
        uses: 'actions/setup-node@v4'
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      # Inputs go through env, not ${{ }} interpolation, so a message containing
      # quotes or backticks can't break out into the shell.
      - name: Deprecate
        run: 'npm deprecate "thirty@$RANGE" "$MESSAGE"'
        env:
          RANGE: ${{ inputs.range }}
          MESSAGE: ${{ inputs.message }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
